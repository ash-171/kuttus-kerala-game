<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#1f6e5c">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" href="favicon.png">
<link rel="apple-touch-icon" href="assets/icon-192.png">
<title>Aru's Kerala</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <svg width="0" height="0" style="position:absolute">
    <defs>
      <symbol id="sym-coin" viewBox="0 0 32 32">
        <circle cx="16" cy="16" r="13" fill="#E7C558" stroke="#8A6B1E" stroke-width="2"/>
        <circle cx="12" cy="12" r="3.5" fill="#FFF3C4" opacity="0.8"/>
      </symbol>
    </defs>
  </svg>

  <div id="stage">
    <div id="sceneWrap">
      <div id="scene">
        <img id="sceneBg" src="assets/bg_home.png" alt="">

        <img id="npcSprite" class="npc" hidden alt="">
        <img id="npcSprite2" class="npc" hidden alt="">
        <img id="npcSprite3" class="npc" hidden alt="">
        <img id="npcTalk" class="npcTalk" hidden alt="">
        <div id="npcBubble" class="speechBubble" hidden></div>

        <div id="plot0" class="groundPlot" hidden><div class="plotHole"></div><img class="plotPlant" alt=""></div>
        <div id="plot1" class="groundPlot" hidden><div class="plotHole"></div><img class="plotPlant" alt=""></div>
        <div id="plot2" class="groundPlot" hidden><div class="plotHole"></div><img class="plotPlant" alt=""></div>

        <img id="homeSprite" src="assets/aru_front.png" alt="Aru" hidden>
        <img id="gearIcon" class="gearIcon" src="assets/props/fishing_net.png" hidden alt="">
        <div id="homeItemFishingNet" class="homeItem" hidden title="Go fishing at the Backwaters">
          <img src="assets/props/fishing_net.png" alt="Fishing Net">
          <span class="badge">&#128269;</span>
        </div>
        <img id="catchIcon" class="catchIcon" hidden alt="">

        <div id="prompt"></div>
        <div id="toasts"></div>

        <div id="dpad" hidden>
          <button id="dpadLeft" type="button" aria-label="Walk left">&larr;</button>
          <button id="dpadRight" type="button" aria-label="Walk right">&rarr;</button>
        </div>
      </div>
      <div id="walkHint" hidden>Walk: <b>A</b>/<b>D</b> or <b>&larr;</b>/<b>&rarr;</b></div>
    </div>

    <div id="sidebar">
      <div id="hud">
        <div id="coinPanel">
          <svg viewBox="0 0 32 32" width="16" height="16"><use href="#sym-coin"/></svg>
          <span id="coinCount">0</span>
        </div>
        <div id="streakPanel">
          <span id="streakFlame">&#128293;</span>
          <span id="streakCount">0</span>
        </div>
        <div id="energyPanel">
          <span class="label">Energy</span>
          <div class="bar"><div id="energyFill"></div></div>
        </div>
      </div>

      <div id="tabs">
        <button class="tabBtn active" id="tabActivity" type="button">Do</button>
        <button class="tabBtn" id="tabBag" type="button">Bag</button>
      </div>

      <div id="bubbleBar"></div>

      <div id="panels">
        <div id="activityPanel" class="panel"></div>
        <div id="bagPanel" class="panel" hidden>
          <p class="shopIntro">Aru's bag — things he's bought, and fish he's caught.</p>
          <div id="bagGrid"></div>
        </div>
      </div>
    </div>

    <button id="sidebarToggle" type="button" aria-label="Collapse sidebar">&laquo;</button>

    <div id="travelOverlay" hidden>
      <img id="travelBgPreview" alt="">
      <div id="travelIcon">&#128694;</div>
      <div id="travelText"></div>
      <div id="travelBarTrack"><div id="travelBarFill"></div></div>
    </div>
  </div>

  <div id="rotatePrompt">
    <div class="icon">&#128241;</div>
    <p>Aru's Kerala plays best in landscape. Please rotate your device.</p>
  </div>

  <script src="game.js"></script>
</body>
</html>
